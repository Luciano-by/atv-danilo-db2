server {
    listen 80;
    server_name _;

    # Reverse proxy: tudo que chegar ao NGINX é encaminhado ao pgAdmin.
    location / {
        proxy_pass http://sala-pgadmin:80;

        # Mantém informações úteis da requisição original.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a conexões persistentes/websocket quando necessário.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
