server {

    listen 80;

    server_name _;

    location / {

        # Encaminha as requisições recebidas pelo NGINX para o pgAdmin
        proxy_pass http://sala-pgadmin:80;

        # Mantém as informações originais da requisição
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}