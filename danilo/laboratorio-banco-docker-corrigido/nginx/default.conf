server {

    listen 80;

    # Domínio utilizado pelo laboratório.
    server_name acessodb.com.br;

    location / {

        # Encaminha as requisições para o pgAdmin.
        proxy_pass http://sala-pgadmin:80;

        # Mantém informações da requisição original.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a conexões persistentes.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
